<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE LEAGUE | Live Finals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.0.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600;900&display=swap');

        :root {
            --brand-amber: #f59e0b;
            --brand-glow: rgba(245, 158, 11, 0.4);
        }

        body {
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-sync { font-family: 'Syncopate', sans-serif; }

        /* Custom Animations */
        @keyframes pulse-ring {
            0% { transform: scale(0.33); opacity: 1; }
            80%, 100% { opacity: 0; }
        }

        .live-dot::before {
            content: '';
            position: absolute;
            width: 300%; height: 300%;
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            border-radius: 45px;
            background-color: #ef4444;
        }

        #toast {
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .amber-glow {
            box-shadow: 0 0 20px var(--brand-glow);
        }

        #chat-messages::-webkit-scrollbar { width: 4px; }
        #chat-messages::-webkit-scrollbar-thumb { background: var(--brand-amber); border-radius: 10px; }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .admin-gradient {
            background: linear-gradient(135deg, rgba(245,158,11,0.1) 0%, rgba(0,0,0,0) 100%);
        }
    </style>
</head>
<body class="antialiased">

    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 flex items-center gap-4 px-6 py-4 rounded-2xl glass border-amber-500/50 z-[300] -translate-y-32 opacity-0 pointer-events-none">
        <div class="w-10 h-10 bg-amber-500 rounded-full flex items-center justify-center text-black shadow-lg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <div class="flex flex-col">
            <span class="text-[10px] uppercase tracking-widest text-amber-500 font-bold">System Alert</span>
            <span id="toastMessage" class="text-sm font-semibold"></span>
        </div>
    </div>

    <header class="p-5 flex justify-between items-center glass sticky top-0 z-50 px-6 md:px-12">
        <div class="flex items-center gap-4">
            <div class="relative flex items-center justify-center">
                <div id="statusIndicator" class="w-3 h-3 bg-zinc-700 rounded-full transition-all duration-500"></div>
            </div>
            <h1 class="font-sync text-lg md:text-xl tracking-tighter flex items-center gap-2">
                ELITE <span class="text-amber-500">LEAGUE</span>
            </h1>
        </div>
        <button id="loginBtn" class="text-[10px] font-black tracking-[0.2em] border border-white/20 px-6 py-2 rounded-full hover:bg-white hover:text-black transition-all">
            ADMIN CONSOLE
        </button>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8 space-y-8">
        
       <section id="adminPanel" class="hidden fade-in px-4 md:px-0">
    <div class="rounded-[2.5rem] overflow-hidden border border-amber-500/30 admin-gradient">
        <div class="p-5 md:p-6 border-b border-white/5 flex justify-between items-center bg-white/5">
            <div>
                <h2 class="text-amber-500 font-sync text-[10px] md:text-sm uppercase tracking-tighter">Broadcaster Hub</h2>
                <p id="broadcastInfo" class="text-[9px] text-zinc-500 uppercase tracking-widest mt-0.5">Status: Ready_to_Stream</p>
            </div>
            <button id="logoutBtn" class="text-[8px] md:text-[9px] font-black text-zinc-400 hover:text-red-500 transition-colors uppercase tracking-widest border border-white/10 px-3 py-1.5 rounded-full">Terminate</button>
        </div>

        <div class="p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 md:gap-8">
            <div class="lg:col-span-7">
                <div class="relative aspect-[9/16] md:aspect-video bg-zinc-950 rounded-[2rem] md:rounded-3xl overflow-hidden ring-1 ring-white/10 group shadow-2xl">
                    <div id="local-player" class="w-full h-full object-cover"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent pointer-events-none"></div>
                    <div class="absolute bottom-6 left-6 flex items-center gap-2">
                        <span class="px-3 py-1.5 bg-amber-500 text-black rounded-lg text-[9px] font-black uppercase tracking-tighter">Local_Preview_Active</span>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5 flex flex-col justify-center space-y-3 md:space-y-4">
                <button id="streamToggleBtn" class="group relative overflow-hidden bg-amber-500 text-black font-black py-10 md:py-8 rounded-[1.8rem] md:rounded-3xl shadow-[0_20px_50px_rgba(245,158,11,0.3)] transition-all active:scale-95">
                    <span class="relative z-10 text-xl md:text-lg uppercase tracking-tighter">Initiate Broadcast</span>
                    <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform"></div>
                </button>

                <div class="grid grid-cols-2 gap-3 md:gap-4">
                    <button id="switchCameraBtn" class="hidden glass hover:bg-white/10 py-5 rounded-2xl flex items-center justify-center gap-2 transition-all">
                        <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        <span class="text-[10px] font-bold uppercase">Flip_View</span>
                    </button>
                    <button id="pushAlertBtn" class="col-span-2 glass hover:bg-amber-500/10 py-5 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] border-amber-500/20 text-amber-500 shadow-lg">
                        Push Global Alert
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 px-4 md:px-0">
    <div class="lg:col-span-2 space-y-4 md:space-y-6">
        <div class="relative bg-zinc-950 rounded-[2.5rem] md:rounded-[3.5rem] overflow-hidden border border-white/5 shadow-2xl aspect-[4/5] md:aspect-video group">
            <div id="standby-ui" class="absolute inset-0 z-10 flex flex-col items-center justify-center text-center p-8 bg-zinc-950">
                <div class="w-20 h-20 mb-6 border-2 border-amber-500/10 rounded-full flex items-center justify-center relative">
                    <div class="absolute inset-0 bg-amber-500/5 rounded-full animate-ping"></div>
                    <div class="w-12 h-12 bg-amber-500/10 rounded-full flex items-center justify-center animate-pulse">
                        <svg class="w-6 h-6 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>
                </div>
                <h2 class="font-sync text-2xl md:text-3xl tracking-tighter mb-2 italic uppercase">System <span class="text-zinc-700">Idle</span></h2>
                <p class="text-zinc-600 text-[9px] font-bold uppercase tracking-[0.3em] max-w-[200px]">Awaiting Uplink from Elite League Hub...</p>
            </div>

            <div id="remote-player" class="absolute inset-0 w-full h-full bg-black object-cover"></div>
            
            <div id="live-tag" class="absolute top-6 left-6 hidden z-20">
                <div class="flex items-center gap-2.5 bg-red-600 text-white px-4 py-2 rounded-xl shadow-2xl border border-white/20">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-white"></span>
                    </span>
                    <span class="text-[10px] font-black uppercase tracking-widest">Live_Arena</span>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-between px-6 py-2">
            <div class="flex items-center gap-3">
                <div class="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse"></div>
                <span class="text-[9px] font-black text-zinc-500 uppercase tracking-[0.4em]">Official_Neural_Link_01</span>
            </div>
            <div class="flex -space-x-2">
                <div class="w-7 h-7 rounded-full bg-zinc-900 border-2 border-black"></div>
                <div class="w-7 h-7 rounded-full bg-zinc-800 border-2 border-black flex items-center justify-center text-[10px] text-amber-500 font-black">+</div>
            </div>
        </div>
    </div>

    <div class="lg:col-span-1 flex flex-col min-h-[500px]">
        <div id="chat-container" class="hidden flex flex-col h-full bg-zinc-900/40 backdrop-blur-xl rounded-[2.5rem] md:rounded-[3rem] border border-white/5 overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-white/5 flex items-center justify-between bg-white/5">
                <h3 class="font-sync text-[9px] text-amber-500 uppercase tracking-widest">Arena_Chat</h3>
                <span class="text-[8px] bg-amber-500/10 px-2 py-1 rounded text-amber-500 font-bold uppercase">Encrypted</span>
            </div>
            
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 font-mono text-[11px]">
                </div>

            <div class="p-5 bg-white/5">
                <div class="relative flex gap-2">
                    <input id="chat-input" type="text" placeholder="Type message..." class="flex-1 bg-black/40 border border-white/10 rounded-2xl px-5 py-4 text-sm focus:outline-none focus:border-amber-500/50 transition-all text-white">
                    <button id="chat-send" class="bg-amber-500 text-black w-14 rounded-2xl flex items-center justify-center hover:scale-95 transition-transform shadow-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
    </main>

    <div id="pinModal" class="fixed inset-0 flex items-center justify-center bg-black/95 z-[500] hidden p-6 backdrop-blur-xl">
        <div class="bg-zinc-950 p-10 rounded-[3.5rem] border border-white/10 w-full max-w-sm text-center shadow-2xl">
            <div class="w-20 h-20 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-8 border border-amber-500/20">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h3 class="font-sync text-lg mb-2 uppercase italic tracking-tighter">Admin Access</h3>
            <p class="text-zinc-500 text-[10px] mb-8 uppercase tracking-[0.2em]">Authorized Personnel Only</p>
            
            <p id="slotMessage" class="text-red-400 text-[10px] mb-6 hidden font-bold uppercase">All server slots are currently occupied.</p>
            
            <input type="password" id="pinInput" maxlength="4" placeholder="••••" class="w-full bg-transparent border-b-2 border-zinc-800 p-4 text-center text-5xl tracking-[0.5em] mb-10 outline-none focus:border-amber-500 text-amber-500 transition-all placeholder:text-zinc-900">
            
            <div class="space-y-4">
                <button id="submitPin" class="w-full bg-amber-500 text-black font-black py-5 rounded-2xl shadow-xl hover:scale-[1.02] transition-transform text-xs uppercase tracking-[0.3em]">
                    Initialize Console
                </button>
                <button id="closePin" class="text-zinc-600 text-[9px] font-black uppercase tracking-widest hover:text-white transition-colors">Abort Connection</button>
            </div>
        </div>
    </div>

    <div id="alertModal" class="fixed inset-0 flex items-center justify-center bg-black/90 z-[600] hidden p-6 backdrop-blur-md">
        <div class="bg-white p-12 rounded-[4rem] w-full max-w-md text-center shadow-[0_0_100px_rgba(255,255,255,0.15)] fade-in">
            <div class="w-20 h-20 bg-amber-500 text-black rounded-full flex items-center justify-center mx-auto mb-8 shadow-xl">
                <svg class="w-10 h-10 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            </div>
            <h3 id="alertTitle" class="text-black font-sync text-2xl mb-4 italic tracking-tighter uppercase"></h3>
            <p id="alertMsg" class="text-zinc-600 mb-12 font-medium leading-relaxed"></p>
            <button id="closeAlert" class="w-full bg-black text-white font-black py-6 rounded-3xl shadow-2xl hover:scale-95 transition-transform uppercase tracking-[0.2em] text-[10px]">
                Acknowledge & Continue
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction, set, push } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDsxf_2FkvyfU2QQsd_DBytd9pPi6r4o0k",
            authDomain: "learning-pro-f756e.firebaseapp.com",
            projectId: "learning-pro-f756e",
            storageBucket: "learning-pro-f756e.firebasestorage.app",
            messagingSenderId: "410163553623",
            appId: "1:410163553623:web:10fceb9616086fe9640a12",
            measurementId: "G-RXKDXG4J84"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const AGORA_APP_ID = "6b0b36a41dae4815b0d440836a4fb1f6";
        const CHANNEL = "EliteLeagueFinals";
        const ADMIN_PIN = "2026";
        const MAX_ADMINS = 4;

        const viewerClient = AgoraRTC.createClient({ mode: "live", codec: "h264" });
        let hostClient = null;
        let localTracks = { audioTrack: null, videoTrack: null };
        let isStreaming = false;
        let currentFacingMode = "user";
        let userId = Math.floor(1000 + Math.random() * 9000);

        const openModal = id => document.getElementById(id)?.classList.remove('hidden');
        const closeModal = id => document.getElementById(id)?.classList.add('hidden');

        const showToast = (msg, duration = 5000) => {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = msg;
            toast.classList.remove('-translate-y-32', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.add('-translate-y-32', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, duration);
        };

        const verifyAdmin = () => {
            const pin = document.getElementById('pinInput')?.value;
            const slotMsg = document.getElementById('slotMessage');

            if (pin !== ADMIN_PIN) {
                showToast("ACCESS DENIED: INVALID PIN");
                document.getElementById('pinInput').value = "";
                return;
            }

            runTransaction(ref(db, 'adminsLive'), (count) => {
                count = count || 0;
                if (count >= MAX_ADMINS) {
                    slotMsg?.classList.remove('hidden');
                    return count;
                }
                return count + 1;
            }).then(r => {
                if (r.committed) {
                    closeModal('pinModal');
                    document.getElementById('adminPanel')?.classList.remove('hidden');
                    document.getElementById('loginBtn').innerText = "LIVE CONSOLE";
                    document.getElementById('loginBtn').classList.add('bg-amber-500', 'text-black', 'border-amber-500');
                    showToast("ADMIN SESSION INITIALIZED");
                }
            });
        };

        const toggleStream = async () => {
            const btn = document.getElementById('streamToggleBtn');
            const switchBtn = document.getElementById('switchCameraBtn');
            const chatContainer = document.getElementById('chat-container');

            if (!isStreaming) {
                try {
                    hostClient = AgoraRTC.createClient({ mode: "live", codec: "h264" });
                    hostClient.setClientRole("host");
                    await hostClient.join(AGORA_APP_ID, CHANNEL, null, null);
                    
                    localTracks.audioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                    try {
                        localTracks.videoTrack = await AgoraRTC.createCameraVideoTrack({
                            encoderConfig: "480p_1",
                            facingMode: currentFacingMode
                        });
                        localTracks.videoTrack.play("local-player");
                    } catch (e) {
                        showToast("CAMERA OFFLINE - AUDIO ONLY");
                    }

                    await hostClient.publish(Object.values(localTracks).filter(Boolean));
                    isStreaming = true;
                    btn.innerText = "TERMINATE BROADCAST";
                    btn.classList.replace('bg-amber-500', 'bg-red-600');
                    btn.classList.add('text-white');
                    switchBtn?.classList.remove('hidden');
                    chatContainer?.classList.remove('hidden');
                    document.getElementById('statusIndicator').classList.add('bg-red-600', 'amber-glow');
                    showToast("BROADCAST IS NOW LIVE");
                } catch (e) { showToast("UPLINK FAILED"); }
            } else {
                location.reload();
            }
        };

        const switchCamera = async () => {
            if (!isStreaming || !localTracks.videoTrack) return;
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            const newTrack = await AgoraRTC.createCameraVideoTrack({ facingMode: currentFacingMode });
            await hostClient.unpublish(localTracks.videoTrack);
            localTracks.videoTrack.close();
            localTracks.videoTrack = newTrack;
            localTracks.videoTrack.play("local-player");
            await hostClient.publish(localTracks.videoTrack);
            showToast("CAMERA SWITCHED");
        };

        const sendPushAlert = () => {
            set(ref(db, 'globalAlert/latest'), {
                title: "GAME BEGUN! 🏆",
                message: "The Elite League Finals are live now! Join the stream.",
                timestamp: Date.now()
            });
        };

        onValue(ref(db, 'globalAlert/latest'), snap => {
            const data = snap.val();
            if (data && Date.now() - data.timestamp < 300000) {
                document.getElementById('alertTitle').innerText = data.title;
                document.getElementById('alertMsg').innerText = data.message;
                openModal('alertModal');
            }
        });

        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');
        const chatMessages = document.getElementById('chat-messages');

        const sendChatMessage = () => {
            const text = chatInput?.value.trim();
            if (!text) return;
            push(ref(db, 'chat'), { userId, text, timestamp: Date.now() });
            chatInput.value = '';
        };

        chatSend?.addEventListener('click', sendChatMessage);
        chatInput?.addEventListener('keypress', e => e.key === 'Enter' && sendChatMessage());

        onValue(ref(db, 'chat'), snap => {
            const data = snap.val();
            if (!data) return;
            chatMessages.innerHTML = '';
            Object.values(data).sort((a,b) => a.timestamp - b.timestamp).slice(-30).forEach(msg => {
                const div = document.createElement('div');
                div.className = 'fade-in bg-white/5 p-3 rounded-2xl border border-white/5';
                div.innerHTML = `<div class="text-[9px] font-black text-amber-500 uppercase mb-1">User ${msg.userId}</div>
                                <div class="text-sm text-zinc-200">${msg.text}</div>`;
                chatMessages.appendChild(div);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        async function initViewer() {
            viewerClient.setClientRole("audience");
            await viewerClient.join(AGORA_APP_ID, CHANNEL, null, null);
            viewerClient.on("user-published", async (user, mediaType) => {
                await viewerClient.subscribe(user, mediaType);
                if (mediaType === "video") {
                    document.getElementById('standby-ui')?.classList.add('hidden');
                    document.getElementById('live-tag')?.classList.remove('hidden');
                    document.getElementById('chat-container')?.classList.remove('hidden');
                    document.getElementById('statusIndicator').classList.add('bg-red-600', 'amber-glow');
                    user.videoTrack.play("remote-player");
                }
                if (mediaType === "audio") user.audioTrack.play();
            });
            viewerClient.on("user-unpublished", () => {
                document.getElementById('standby-ui')?.classList.remove('hidden');
                document.getElementById('live-tag')?.classList.add('hidden');
                document.getElementById('statusIndicator').classList.remove('bg-red-600', 'amber-glow');
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            initViewer();
            document.getElementById('loginBtn')?.addEventListener('click', () => openModal('pinModal'));
            document.getElementById('submitPin')?.addEventListener('click', verifyAdmin);
            document.getElementById('closePin')?.addEventListener('click', () => closeModal('pinModal'));
            document.getElementById('pushAlertBtn')?.addEventListener('click', sendPushAlert);
            document.getElementById('streamToggleBtn')?.addEventListener('click', toggleStream);
            document.getElementById('switchCameraBtn')?.addEventListener('click', switchCamera);
            document.getElementById('closeAlert')?.addEventListener('click', () => closeModal('alertModal'));
            document.getElementById('logoutBtn')?.addEventListener('click', () => location.reload());
        });
    </script>
</body>
</html>
